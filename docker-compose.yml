version: "3.8"
services:
  redis:
    image: "redis:alpine"
    ports:
      - "6379:6379"

  proxay:
    build: .
    ports:
      - "3000:3000"
    depends_on:
      - redis
    # The command to run inside the container.
    # Users should modify this to their needs, e.g., changing the mode or host.
    command: >
      --mode record
      --host http://host.docker.internal:8080
      --redis-host redis
      --port 3000
      --verbose
