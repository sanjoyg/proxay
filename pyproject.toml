[tool.poetry]
name = "proxay"
version = "1.9.0"
description = "A proxy server that helps you write faster tests, ported to Python."
authors = ["Jules <agent@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.9"
redis = "^5.0.0"
pyyaml = "^6.0"
requests = "^2.31.0"
fastapi = "^0.109.2"
uvicorn = "^0.27.1"
python-multipart = "^0.0.7"
termcolor = "^2.4.0"
deepdiff = "^6.7.1"
thefuzz = {extras = ["speedup"], version = "^0.20.0"}
brotli = "^1.1.0"

[tool.poetry.dev-dependencies]
pytest = "^8.0.0"
fakeredis = "^2.21.0"
pytest-asyncio = "^0.23.5"

[tool.poetry.scripts]
proxay = "proxay.cli:main"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
